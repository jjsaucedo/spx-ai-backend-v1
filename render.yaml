services:
  - type: web
    name: spx-ai-backend-v1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: CORS_ORIGINS
        value: "*"
